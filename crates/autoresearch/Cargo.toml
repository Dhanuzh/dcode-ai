[package]
name = "dcode-ai-autoresearch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Autonomous research loop for dcode-ai — AI agents running experiments iteratively"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["process", "time", "sync", "fs"] }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Error handling
anyhow = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regex for metric parsing
regex = "1"

# Tracing/logging
tracing = { workspace = true }

# Parking lot for efficient synchronization
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
