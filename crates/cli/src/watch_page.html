<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>__TITLE__ · dcode-ai live</title>
<style>
  :root {
    --bg: #171412; --panel: #1f1b18; --line: #342d28; --text: #ece6df;
    --muted: #8f857c; --accent: #d97757; --ok: #7fbf7f; --bad: #e06c75; --warn: #d9b257;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf8f5; --panel: #ffffff; --line: #e6e0d8; --text: #2b2420;
      --muted: #8a8079; --accent: #c4613f; --ok: #3f8f3f; --bad: #c23b46; --warn: #a37a12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); animation: pulse 1.6s infinite; }
  .dot.busy { background: var(--accent); animation: pulse .8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent); opacity: 1 }
    50% { opacity: .35 } 100% { opacity: 1 } }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  #log { padding: 16px 20px 80px; }
  .msg { margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
  .user { color: var(--text); padding-left: 14px; border-left: 2px solid var(--accent); }
  .user::before { content: "› "; color: var(--accent); margin-left: -14px; }
  .reply::before { content: "● "; color: var(--ok); }
  .tool { color: var(--muted); font-size: 13px; margin: 0 0 6px 14px; }
  .tool .name { color: var(--text); }
  .tool.ok::after { content: " ✓"; color: var(--ok); }
  .tool.bad::after { content: " ✗"; color: var(--bad); }
  .tool.run::after { content: " …"; color: var(--accent); }
  .note { color: var(--warn); font-size: 13px; margin: 0 0 10px 14px; }
  .err { color: var(--bad); margin: 0 0 10px 14px; }
  .typing { opacity: .85; }
  aside { border-left: 1px solid var(--line); padding: 16px 18px; position: sticky; top: 49px;
    align-self: start; max-height: calc(100vh - 49px); overflow: auto; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .stat { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  .stat b { color: var(--text); font-weight: 500; }
  #files { list-style: none; padding: 0; margin: 0 0 18px; font-size: 13px; }
  #files li { display: flex; gap: 6px; padding: 2px 0; color: var(--muted); transition: color .6s; }
  #files li.edit { color: var(--text); }
  #files li.fresh { color: var(--accent); }
  #files li .n { margin-left: auto; color: var(--muted); }
  #me { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--text);
    font: inherit; font-size: 12px; padding: 3px 8px; width: 130px; }
  #people { list-style: none; padding: 0; margin: 0 0 18px; font-size: 13px; }
  #people li { padding: 2px 0; color: var(--text); }
  #people li .r { color: var(--muted); }
  #people li.watch::before { content: "👀 "; }
  #people li.join::before { content: "⌨ "; }
  #todos { list-style: none; padding: 0; margin: 0 0 18px; font-size: 13px; }
  #todos li.r { color: var(--muted); text-decoration: line-through; }
  .chatline { color: var(--accent); margin: 0 0 10px 14px; }
  .chatpic { max-width: min(420px, 90%); max-height: 320px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--border, #444); cursor: zoom-in; }
  .said { color: #3f7fbf; margin: 0 0 10px 14px; }
  #chat { position: fixed; bottom: 0; left: 0; right: 0; z-index: 3; display: none; gap: 8px; align-items: center;
    padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--line); }
  body.chat #chat { display: flex; }
  body.chat footer { display: none; }
  #chat input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font: inherit; }
  #chat button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px;
    font: inherit; cursor: pointer; }
  #chat button:disabled { opacity: .5; cursor: default; }
  #chatnote { color: var(--muted); font-size: 12px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 20px; font-size: 12px;
    color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>✻ __TITLE__</h1>
  <input id="me" placeholder="your name" maxlength="24" aria-label="your name (shown in the office)">
  <span class="live"><span id="dot" class="dot"></span><span id="state">connecting…</span></span>
</header>
<main>
  <section id="log"></section>
  <aside>
    <h2>Activity</h2>
    <div class="stat"><span>tool calls</span><b id="tools">0</b></div>
    <div class="stat"><span>files edited</span><b id="edited">0</b></div>
    <div class="stat"><span>tokens</span><b id="tokens">0</b></div>
    <div class="stat" style="margin-bottom:18px"><span>context</span><b id="ctx">–</b></div>
    <h2>Here now</h2>
    <ul id="people"><li class="r">–</li></ul>
    <h2>Shared to-dos</h2>
    <ul id="todos"><li class="r">–</li></ul>
    <h2>Files touched</h2>
    <ul id="files"></ul>
  </aside>
</main>
<div id="chat">
  <span id="chatnote">Ask the host to let you in, then you can send messages.</span>
  <button id="knock" type="button">Ask to join</button>
  <input id="say" placeholder="message the agent · /chat <text> to people · /todo <text>" maxlength="4000" hidden>
  <button id="send" type="button" hidden>Send</button>
</div>
<footer>Read-only live view of a dcode-ai session · nothing here can change it</footer>
<script>
(() => {
  const log = document.getElementById('log');
  const stateEl = document.getElementById('state');
  const dot = document.getElementById('dot');
  const files = new Map();
  const tools = new Map();
  let toolCount = 0, typing = null;
  const EDITS = ['write_file','edit_file','apply_patch','replace_match','notebook_edit','delete_path','move_path','rename_path'];
  const READS = ['read_file','list_directory','inspect_binary','query_symbols','copy_path'];

  const el = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; return d; };
  const stick = () => (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 80;
  const add = (node) => { const s = stick(); log.appendChild(node); if (s) window.scrollTo(0, document.body.scrollHeight); };
  const human = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);

  function touch(tool, input) {
    if (!EDITS.includes(tool) && !READS.includes(tool)) return null;
    const p = input && (input.path || input.file_path || input.notebook_path || input.from);
    if (!p) return null;
    const f = files.get(p) || { r: 0, e: 0 };
    if (EDITS.includes(tool)) f.e++; else f.r++;
    f.at = Date.now();
    files.set(p, f);
    renderFiles();
    return p;
  }
  function renderFiles() {
    const ul = document.getElementById('files');
    ul.textContent = '';
    [...files.entries()].sort((a, b) => b[1].at - a[1].at).slice(0, 60).forEach(([p, f]) => {
      const li = document.createElement('li');
      if (f.e) li.classList.add('edit');
      if (Date.now() - f.at < 4000) li.classList.add('fresh');
      const name = document.createElement('span'); name.textContent = (f.e ? '✎ ' : '· ') + p;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = f.e ? f.e + '✎' : f.r + 'r';
      li.append(name, n); ul.appendChild(li);
    });
    document.getElementById('edited').textContent = [...files.values()].filter(f => f.e).length;
  }
  setInterval(renderFiles, 2000);

  function target(tool, input) {
    if (!input) return '';
    return input.path || input.file_path || input.command || input.action || input.query || input.pattern || '';
  }
  function setState(text, cls) { stateEl.textContent = text; dot.className = 'dot ' + cls; }

  function handle(ev) {
    switch (ev.type) {
      case 'MessageReceived':
        if (ev.role === 'user') { add(el('msg user', (ev.content || '').replace(/\s*<team-todos>[\s\S]*?<\/team-todos>/, ''))); }
        else if (ev.role === 'assistant') {
          if (typing) { typing.remove(); typing = null; }
          if ((ev.content || '').trim()) add(el('msg reply', ev.content));
        }
        break;
      case 'TokensStreamed':
        if (!typing) { typing = el('msg reply typing', ''); add(typing); }
        typing.textContent += ev.delta || '';
        break;
      case 'ToolCallStarted': {
        if (typing) { typing.classList.remove('typing'); typing = null; }
        toolCount++; document.getElementById('tools').textContent = toolCount;
        const p = touch(ev.tool, ev.input);
        const d = document.createElement('div'); d.className = 'tool run';
        const n = document.createElement('span'); n.className = 'name'; n.textContent = ev.tool;
        d.append(n, document.createTextNode(' ' + String(p || target(ev.tool, ev.input)).slice(0, 140)));
        tools.set(ev.call_id, d); add(d);
        break;
      }
      case 'ToolCallCompleted': {
        const d = tools.get(ev.call_id);
        if (d) { d.classList.remove('run'); d.classList.add(ev.output && ev.output.success ? 'ok' : 'bad'); }
        break;
      }
      case 'ApprovalRequested': add(el('note', '⏸ waiting for approval: ' + ev.tool)); break;
      case 'QuestionRequested': add(el('note', '? waiting for an answer')); break;
      case 'ContextCompaction': if (ev.phase === 'completed') add(el('note', '⟳ ' + ev.message)); break;
      case 'ChildSessionSpawned': add(el('note', '◇ sub-agent: ' + (ev.task || ''))); break;
      case 'Error': add(el('err', '✗ ' + ev.message)); break;
      case 'CostUpdated':
        document.getElementById('tokens').textContent = human((ev.input_tokens || 0) + (ev.output_tokens || 0));
        if (ev.context_tokens) document.getElementById('ctx').textContent = human(ev.context_tokens);
        break;
      case 'BusyStateChanged':
        if (ev.state === 'idle') setState('live · idle', 'on'); else setState('live · ' + ev.state, 'busy');
        break;
      case 'SessionEnded': setState('session ended', ''); break;
      case 'PersonJoined':
        if (ev.role !== 'owner') { people.set(ev.person, { name: ev.name, role: ev.role }); renderPeople();
          add(el('note', '⇢ ' + ev.name + (ev.role === 'watch' ? ' is watching' : ' joined'))); }
        break;
      case 'PersonLeft':
        if (people.delete(ev.person)) { renderPeople(); if (ev.name) add(el('note', '⇠ ' + ev.name + ' left')); }
        break;
      case 'PersonSaid': add(el('said', ev.name + ': ' + ev.text)); break;
      case 'PersonChat': {
        const line = el('chatline', '💬 ' + ev.name + ': ' + (ev.text || (ev.image ? 'sent a picture' : '')));
        const im = ev.image;
        if (im && (im.mime === 'image/png' || im.mime === 'image/jpeg') && /^[A-Za-z0-9+/=]+$/.test(im.data || '')) {
          const pic = document.createElement('img');
          pic.className = 'chatpic'; pic.alt = im.name || 'picture';
          pic.src = 'data:' + im.mime + ';base64,' + im.data;
          pic.addEventListener('click', () => window.open(pic.src, '_blank'));
          line.appendChild(document.createElement('br')); line.appendChild(pic);
        }
        add(line); break;
      }
      case 'TeamTodoAdded': todos.push({ id: ev.id, text: ev.text, by: ev.by, done: false });
        add(el('note', '☐ ' + ev.by + ' added a to-do: ' + ev.text)); renderTodos(); break;
      case 'TeamTodoDone': { const t = todos.find(x => x.id === ev.id);
        if (t && !t.done) { t.done = true; add(el('note', '☑ ' + ev.by + ' ticked off: ' + t.text)); renderTodos(); } break; }
    }
  }

  // The shared to-do list.
  const todos = [];
  function renderTodos() {
    const ul = document.getElementById('todos');
    ul.textContent = '';
    if (!todos.length) { ul.appendChild(Object.assign(document.createElement('li'), { className: 'r', textContent: '–' })); return; }
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      li.textContent = (i + 1) + '. ' + (t.done ? '☑ ' : '☐ ') + t.text;
      if (t.done) li.className = 'r';
      ul.appendChild(li);
    });
  }

  // Who else is here (people who arrive while this page is open).
  const people = new Map();
  function renderPeople() {
    const ul = document.getElementById('people');
    ul.textContent = '';
    if (!people.size) { ul.appendChild(Object.assign(document.createElement('li'), { className: 'r', textContent: '–' })); return; }
    people.forEach((p) => {
      const li = document.createElement('li'); li.className = p.role;
      li.textContent = p.name + ' ';
      const r = document.createElement('span'); r.className = 'r'; r.textContent = p.role === 'watch' ? 'watching' : 'joined';
      li.appendChild(r); ul.appendChild(li);
    });
  }

  // Your name shows you in the office; it stays in this browser only.
  const me = document.getElementById('me');
  let myName = '';
  try { myName = localStorage.getItem('dcode-ai-watch-name') || ''; } catch (_) {}
  me.value = myName;
  let src = null;
  // `/invite web`: this page may ask to join and send messages.
  const CHAT = '__CHAT__' === '1';
  let guest = '';
  try { guest = sessionStorage.getItem('dcode-ai-guest') || ''; } catch (_) {}
  function connect() {
    if (src) src.close();
    people.clear(); renderPeople();
    log.textContent = ''; files.clear(); tools.clear(); toolCount = 0; typing = null; todos.length = 0;
    const q = (myName ? '&name=' + encodeURIComponent(myName) : '') + (guest ? '&p=' + encodeURIComponent(guest) : '');
    src = new EventSource('/events?t=__TOKEN__' + q);
    src.onopen = () => setState('live', 'on');
    src.onerror = () => setState('reconnecting…', '');
    src.onmessage = (m) => { try { const env = JSON.parse(m.data); handle(env.event || env); } catch (_) {} };
  }
  const knockBtn = document.getElementById('knock'), sayIn = document.getElementById('say'),
        sendBtn = document.getElementById('send'), chatNote = document.getElementById('chatnote');
  function joined() {
    knockBtn.hidden = true; chatNote.hidden = true; sayIn.hidden = false; sendBtn.hidden = false;
    if (watching) sayIn.placeholder = 'Message the people here (you\'re watching)';
  }
  let watching = false;
  try { watching = !!sessionStorage.getItem('dcode-ai-watching'); } catch (_) {}
  if (CHAT) {
    document.body.classList.add('chat');
    if (guest) joined();
    knockBtn.addEventListener('click', async () => {
      if (!myName) { me.focus(); chatNote.textContent = 'Type your name at the top first.'; return; }
      knockBtn.disabled = true; chatNote.textContent = 'Waiting for the host to let you in…';
      try {
        const r = await fetch('/knock?t=__TOKEN__&name=' + encodeURIComponent(myName), { method: 'POST' });
        const j = await r.json();
        if (j.ok) {
          guest = j.p; watching = j.role === 'watch';
          try { sessionStorage.setItem('dcode-ai-guest', guest); sessionStorage.setItem('dcode-ai-watching', watching ? '1' : ''); } catch (_) {}
          joined(); connect(); sayIn.focus();
        } else { chatNote.textContent = 'The host didn\'t let you in.'; }
      } catch (_) { chatNote.textContent = 'Could not reach the host.'; }
      knockBtn.disabled = false;
    });
    const send = async () => {
      const text = sayIn.value.trim();
      if (!text || !guest) return;
      sendBtn.disabled = true;
      try {
        let route = watching ? '/chat' : '/say', body = text;
        if (text.startsWith('/chat ')) { route = '/chat'; body = text.slice(6); }
        else if (text.startsWith('/todo ')) { route = '/todo'; body = text.slice(6); }
        const r = await fetch(route + '?t=__TOKEN__&p=' + encodeURIComponent(guest), { method: 'POST', body });
        if (r.ok) sayIn.value = ''; else { chatNote.hidden = false; chatNote.textContent = 'Not let in any more.'; }
      } catch (_) {}
      sendBtn.disabled = false; sayIn.focus();
    };
    sendBtn.addEventListener('click', send);
    sayIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  }
  me.addEventListener('change', () => {
    myName = me.value.trim().slice(0, 24);
    try { localStorage.setItem('dcode-ai-watch-name', myName); } catch (_) {}
    connect();
  });
  connect();
})();
</script>
</body>
</html>
