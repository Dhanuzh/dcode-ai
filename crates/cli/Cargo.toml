[package]
name = "dcode-ai-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Interactive TUI shell and CLI entrypoint for dcode-ai"

[[bin]]
name = "dcode-ai"
path = "src/main.rs"

[dependencies]
toml = { workspace = true }
regex = "1"
dcode-ai-autoresearch = { workspace = true }
dcode-ai-common = { workspace = true }
dcode-ai-core = { workspace = true }
dcode-ai-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
reedline = "0.52"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "html", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = "0.12"
ansi-to-tui = "8"
textwrap = "0.16"
unicode-segmentation = "1.13"
unicode-width = "0.2"
ignore = "0.4"
colored = "3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
similar = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
url = "2"
notify-rust = { version = "4", optional = true }
snow = "0.9"
# Direct peer-to-peer invites: hole-punched QUIC, dialed by public key.
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
qrcode = { version = "0.14", default-features = false }
# Sessions that outlive the terminal: the session runs in a pseudo-terminal
# owned by a background host.
portable-pty = "0.9"
libc = "0.2"
vt100 = "0.15"
# Slack Socket Mode (`/slack`): a websocket out to Slack, no public URL.
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Speech to text on this machine (`/talk`): Whisper in pure Rust, CPU only.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }

# No `scrolling-regions`: with it, `Terminal::insert_before` flushes history
# with DECSTBM partial-screen scrolls, and lines scrolled out of a margin
# region are *discarded* instead of reaching scrollback — on Windows
# terminals, and on Linux ones too (a long reply lost everything above the
# last screenful). The portable path (real newlines at the bottom row)
# reaches the scrollback on every terminal.
[target.'cfg(windows)'.dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[target.'cfg(not(windows))'.dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[features]
desktop-notify = ["notify-rust"]

[dev-dependencies]
dcode-ai-runtime = { workspace = true }
tempfile = "3"
portable-pty = "0.9"
vt100 = "0.15"
assert_cmd = "2"
insta = "1"
predicates = "3"
criterion = "0.5"
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy", "run-cargo-test"] }

[[bench]]
name = "tui_perf"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.15"
